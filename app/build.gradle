plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 64-bit build: -PtargetAbi=arm64-v8a (default). 32-bit build: -PtargetAbi=armeabi-v7a
def abi = project.findProperty('targetAbi') ?: 'arm64-v8a'

android {
    namespace 'com.example.clonespace'
    compileSdk 33
    defaultConfig {
        applicationId 'com.example.clonespace'
        minSdk 21
        // 28 on purpose: keeps legacy storage + lets cloned apps request permissions like a normal app.
        targetSdk 28
        versionCode 1
        versionName '1.0'
        ndk { abiFilters abi }
        // lets the 32-bit and 64-bit editions be installed side by side
        if (abi == 'armeabi-v7a') applicationIdSuffix '.arm32'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    packagingOptions { jniLibs { useLegacyPackaging = true } }
    lint { abortOnError false }
}

dependencies {
    implementation project(':Bcore')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'com.google.android.material:material:1.9.0'
}
